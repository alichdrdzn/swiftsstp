# CI — every push and pull request.
#
# Three jobs, mirroring the three build targets:
#   engine  — Go module tests (tunnel, multi, reconnect, usage, internal/*)
#   windows — windows/ module vet+test, frontend syntax check, Wails
#             cross-compile to windows/amd64 (COMPILE-VERIFIED on Linux)
#   android — gomobile-bind the engine AAR, then assembleDebug
#
# The gomobile AAR is NOT committed; CI rebuilds it from source every run
# (see .gitignore for the exact bind command).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  windows:
    name: Windows app (Wails)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Wails CLI (pinned)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Go build + vet + test (windows module)
        working-directory: windows
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Frontend syntax check
        run: node --check windows/frontend/dist/app.js
      - name: Cross-compile windows/amd64
        working-directory: windows
        run: wails build -platform windows/amd64

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Puts sdkmanager on PATH and accepts the SDK licenses; the runner's
      # preinstalled SDK does not expose the command-line tools by itself.
      # Override `packages`: the default is "tools platform-tools", but the
      # legacy `tools` package no longer exists in Google's repository, so
      # sdkmanager exits 1 ("Failed to find package 'tools'") and the step
      # fails. Everything else is installed by the explicit step below.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android packages (NDK, platform, build-tools)
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Install gomobile + gobind (pinned to go.mod's x/mobile)
        run: |
          XM_VER=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$XM_VER
          go install golang.org/x/mobile/cmd/gobind@$XM_VER
      - name: Build engine AAR
        run: |
          set -o pipefail
          # ANDROID_HOME is a machine-level variable: it is NOT available in
          # the ${{ env }} context, so export NDK_HOME from the shell instead.
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="$SDK/ndk/27.2.12479018"
          # gomobile bind does NOT create the output directory, and the AAR
          # is gitignored so a fresh checkout has no android/app/libs/ at all.
          mkdir -p android/app/libs
          {
            echo "go: $(go version); javac: $(javac -version 2>&1); JAVA_HOME=$JAVA_HOME"
            echo "platforms: $(ls "$SDK/platforms" | tr '\n' ' ')"; df -h /
          } 2>&1 | tee /tmp/aar-build.log
          rc=0
          gomobile bind -target=android -androidapi 26 -javapkg swiftsstp \
            -ldflags='-s -w' -trimpath -o android/app/libs/mobile.aar ./mobile \
            2>&1 | tee -a /tmp/aar-build.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            # Job logs need auth to read; surface the failure via the
            # PUBLIC annotations channel instead. GitHub caps annotations
            # at 10 per step, so emit ONE combined line.
            { echo "### gomobile bind failed (rc=$rc)"; echo '```'
              tail -n 40 /tmp/aar-build.log; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=aar-bind::$(tail -n 25 /tmp/aar-build.log | tr '\n' '|' | cut -c1-1500)"
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug
        working-directory: android
        run: |
          set -o pipefail
          rc=0
          ./gradlew assembleDebug --console=plain 2>&1 | tee /tmp/gradle.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            # Job logs are auth-gated; surface the failure publicly.
            { echo "### assembleDebug failed (rc=$rc)"; echo '```'
              tail -n 40 /tmp/gradle.log; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=gradle::$(tail -n 25 /tmp/gradle.log | tr '\n' '|' | cut -c1-1500)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: swiftsstp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
