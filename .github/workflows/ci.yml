# CI — every push and pull request.
#
# Three jobs, mirroring the three build targets:
#   engine  — Go module tests (tunnel, multi, reconnect, usage, internal/*)
#   windows — windows/ module vet+test, frontend syntax check, Wails
#             cross-compile to windows/amd64 (COMPILE-VERIFIED on Linux)
#   android — gomobile-bind the engine AAR, then assembleDebug
#
# The gomobile AAR is NOT committed; CI rebuilds it from source every run
# (see .gitignore for the exact bind command).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  windows:
    name: Windows app (Wails)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Wails CLI (pinned)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Go build + vet + test (windows module)
        working-directory: windows
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Frontend syntax check
        run: node --check windows/frontend/dist/app.js
      - name: Cross-compile windows/amd64
        working-directory: windows
        run: wails build -platform windows/amd64

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK (pinned to the version this repo builds with)
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Install gomobile + gobind (pinned to go.mod's x/mobile)
        run: |
          XM_VER=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$XM_VER
          go install golang.org/x/mobile/cmd/gobind@$XM_VER
      - name: Build engine AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          gomobile bind -target=android -androidapi 26 -javapkg swiftsstp \
            -ldflags='-s -w' -trimpath -o android/app/libs/mobile.aar ./mobile
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: swiftsstp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
